_subdirectory: ""
_answers_file: .copier-answers.yml
_templates_suffix: .j2

company_slug:
  type: str
  default: holdingco
  help: "Company slug for path derivation (e.g., holdingco, softwareco)"

company_name:
  type: str
  default: Holding Company
  help: "Company display name (e.g., Holding Company, Software Company)"

repo_slug:
  type: str
  help: "Repo slug (e.g. agent-triage)"

enable_community_pack:
  type: bool
  default: false
  help: "Inherited compatibility flag from L1 profile; currently metadata-only in tpl-agent-repo."

enable_release_pack:
  type: bool
  default: false
  help: "Inherited compatibility flag from L1 profile; currently metadata-only in tpl-agent-repo."

enable_vouch_gate:
  type: bool
  default: false
  help: "Inherited compatibility flag from L1 profile; currently metadata-only in tpl-agent-repo."

core_owner_handle:
  type: str
  default: "@core-owner"
  help: "CODEOWNERS entry for core docs paths"

agent_owner_handle:
  type: str
  default: "@agent-owner"
  help: "CODEOWNERS entry for agent-owned paths"

agent_name:
  type: str
  default: "{{ repo_slug }}"
  help: "Canonical agent name recorded in agent.json."

agent_role:
  type: str
  help: "Required single role-card name for this one-agent repository."

creation_task_id:
  type: str
  help: "Required AK creation task id (AK-<number>) naming the role, recurring pain, and differentiation."

system_prompt_file:
  type: str
  default: docs/person/system-prompt.md
  help: "Compiled system prompt path recorded in agent.json."

skill_profile:
  type: str
  default: ""
  help: "Published skill profile key, or empty for no profile."

skill_extras:
  type: str
  default: "[]"
  help: "JSON array of extra skill keys."

agent_tools:
  type: str
  default: "[]"
  help: "JSON array of tool names."

agent_extensions:
  type: str
  default: "[]"
  help: "JSON array of extension names."

agent_model:
  type: str
  default: ""
  help: "Default model name, or empty for runtime selection."

agent_thinking:
  type: str
  default: medium
  help: "Default thinking level."

agent_scope:
  type: str
  default: '{"repos": [], "forbidden": [], "note": ""}'
  help: "JSON object describing advisory scope; it grants no authority."

_tasks:
  - command: "python3 scripts/compile-system-prompt.py"
