_subdirectory: ""
_answers_file: .copier-answers.yml
_templates_suffix: .j2

company_slug:
  type: str
  default: holdingco
  help: "Company slug for path derivation (e.g., holdingco, softwareco)"

company_name:
  type: str
  default: Holding Company
  help: "Company display name (e.g., Holding Company, Software Company)"

repo_slug:
  type: str
  help: "Repo slug (e.g. holdingco-handbook)"

enable_community_pack:
  type: bool
  default: false
  help: "Inherited compatibility flag from L1 profile; currently metadata-only in tpl-org-repo."

enable_release_pack:
  type: bool
  default: false
  help: "Inherited compatibility flag from L1 profile; currently metadata-only in tpl-org-repo."

enable_vouch_gate:
  type: bool
  default: false
  help: "Inherited compatibility flag from L1 profile; currently metadata-only in tpl-org-repo."

rocs_cli_version:
  type: str
  default: "0.4.3"
  help: "rocs-cli release pinned by scripts/rocs.sh; the workspace core checkout (~/ai-society/core/rocs-cli) must match major.minor with patch >= this pin"
  validator: >-
    {% if rocs_cli_version.split('.') | length != 3 or not rocs_cli_version.replace('.', '').isdigit() %}
    rocs_cli_version must be a plain MAJOR.MINOR.PATCH release such as 0.4.3.
    {% endif %}

core_owner_handle:
  type: str
  default: "@core-owner"
  help: "CODEOWNERS entry for core docs paths"

org_owner_handle:
  type: str
  default: "@org-owners"
  help: "CODEOWNERS entry for org-owned paths"
