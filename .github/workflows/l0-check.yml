name: l0-check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.22'
          enable-cache: false

      - name: Provision birth sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Ubuntu restricts user namespaces through AppArmor. Admit only bwrap;
          # do not disable the host-wide restriction or the production sandbox.
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
              'profile ci-bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' \
              | sudo tee /etc/apparmor.d/ci-bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/ci-bwrap
          fi
          bwrap --die-with-parent --unshare-pid --unshare-ipc --unshare-uts \
            --ro-bind / / --dev /dev --proc /proc /usr/bin/true

      - name: Provision pinned ROCS core
        run: |
          core="$RUNNER_TEMP/rocs-ci"
          git init "$core"
          git -C "$core" fetch --depth=1 https://github.com/tryingET/rocs-cli.git \
            ac75e95e30d66b3543abca27cb79d69a9dc01e93
          git -C "$core" checkout --detach FETCH_HEAD
          test "$(git -C "$core" rev-parse HEAD)" = ac75e95e30d66b3543abca27cb79d69a9dc01e93
          uv sync --project "$core" --frozen
          uv run --project "$core" --frozen rocs version

      - name: Run L0 checks
        env:
          TMPDIR: ${{ runner.temp }}
          L0_CHECK_VERBOSE: '1'
          ROCS_CORE_PROJECT: ${{ runner.temp }}/rocs-ci
        run: bash ./scripts/check-l0.sh
